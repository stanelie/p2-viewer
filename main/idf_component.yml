dependencies:
  idf: ">=5.5"
  espressif/usb_host_uvc:
    version: "*"
  espressif/usb:
    version: "*"
    rules:
      - if: "idf_version >=5.5.3"
  espressif/esp_lcd_st7796:
    version: "^1"
  espressif/esp_lcd_touch_ft5x06:
    version: "^1"
  # Built-in OV5647 on the board's MIPI-CSI connector. 0.8.x is the branch for IDF < 6.0
  # (Waveshare's own 09_video_lcd_display example pins the same range).
  esp_video:
    version: "==0.9.1"
  # WiFi: the ESP32-P4 has no radio, so the onboard ESP32-C6 provides it over esp-hosted.
  # Versions follow Waveshare's own 04_wifistation example for this board.
  espressif/esp_wifi_remote:
    version: "0.14.*"
  espressif/esp_hosted:
    version: "1.4.*"
